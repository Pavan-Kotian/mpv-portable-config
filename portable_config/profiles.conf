### Conditional Profiles ###

[HDR]
profile-desc=HDR
profile-cond=(p["video-params/primaries"] == "bt.2020") and ((p["video-params/gamma"] == "pq") or (p["video-params/gamma"] == "hlg"))
profile-restore=copy
icc-profile=""
icc-profile-auto=no
target-colorspace-hint=yes
target-prim=auto
target-trc=auto
#target-peak=1068 (Set to your exact peak brightness)
#sub-hdr-peak=1068 (Same as target-peak)
image-subs-hdr-peak=500
tone-mapping=auto
hdr-peak-percentile=99.95
hdr-contrast-recovery=0.30
hdr-peak-decay-rate=20.0
gamut-mapping-mode=auto
inverse-tone-mapping=no
hdr-compute-peak=yes
#target-contrast=4000 (Set to your exact contrast)
video-output-levels=full
	
[4k-Downscaling]
profile-cond=(height >= 2160 or width >= 3840)
profile-restore=copy-equal
glsl-shaders-clr
glsl-shaders="~~/shaders/ssimsr.glsl;~~/shaders/ssimds.glsl"

linear-downscaling=no

[Downmix-Audio-5.1]
profile-cond=get("audio-params/channel-count") >= 5 and get("audio-params/channel-count") < 7
profile-restore=copy-equal
volume-max=200
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.707*FL+0.707*BL+0.5*LFE|FR=0.5*FC+0.707*FR+0.707*BR+0.5*LFE"

[Downmix-Audio-7.1]
profile-cond=get("audio-params/channel-count") >= 7
profile-restore=copy-equal
volume-max=200
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.3*FLC+0.3*FL+0.3*BL+0.3*SL+0.5*LFE|FR=0.5*FC+0.3*FRC+0.3*FR+0.3*BR+0.3*SR+0.5*LFE"